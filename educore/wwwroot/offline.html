<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline | SmartSchoolWala.com</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #fff7ed 0%, #f8f7f5 50%, #fff4e6 100%);
            color: #2b2c40;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #f0eee9;
            border-radius: 22px;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 24px rgba(67, 89, 113, .14);
            text-align: center;
        }

        .logo { width: 200px; max-width: 70%; height: auto; margin: 0 auto 1.5rem; display: block; }

        h1 { font-size: 1.5rem; font-weight: 800; color: #2b1b12; margin: 0 0 .5rem; }

        p { color: #8b8175; font-size: .92rem; line-height: 1.6; margin: 0 0 1.75rem; }

        button {
            width: 100%;
            min-height: 50px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #ff9a1f 0%, #ff8a00 55%, #f07c00 100%);
            box-shadow: 0 6px 16px rgba(255, 138, 0, .28);
        }

        button:active { filter: brightness(.96); }

        .hint { font-size: .78rem; color: #9a938b; margin: 1.25rem 0 0; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/img/brand/ssw-stacked.png" alt="SmartSchoolWala.com" />

        <h1>You're offline</h1>
        <p>
            SmartSchoolWala needs an internet connection to load your school's data.
            Check your Wi-Fi or mobile network, then try again.
        </p>

        <button type="button" onclick="location.reload()">Try again</button>

        <p class="hint">This page is stored on your device so it works without a connection.</p>
    </div>
</body>
</html>
